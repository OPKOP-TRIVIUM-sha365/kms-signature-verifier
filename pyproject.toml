[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kms-signature-verifier"
version = "1.0.0"
description = "Professional toolkit for offline KMS signature verification with audit logging"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vildan KULJANOVIĆ", email = "kuljanovic99@icloud.com"}
]
keywords = ["kms", "signature", "verification", "cryptography", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "python-gnupg>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "bandit>=1.7.5",
    "safety>=2.3.5",
]

[project.urls]
Homepage = "https://github.com/OPKOP-TRIVIUM-sha365/kms-signature-verifier"
Documentation = "https://github.com/OPKOP-TRIVIUM-sha365/kms-signature-verifier/wiki"
Repository = "https://github.com/OPKOP-TRIVIUM-sha365/kms-signature-verifier.git"
Issues = "https://github.com/OPKOP-TRIVIUM-sha365/kms-signature-verifier/issues"

[tool.setuptools]
packages = ["kms_signature_verifier"]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
